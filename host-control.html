<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loup Garou</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    /* ===== أنماط خاصة بتحكم الراوي ===== */
    *[class*="discord"], *[id*="discord"] { display: none !important; }

    .info-box {
      background: rgba(13, 8, 5, 0.6);
      border: 1px solid rgba(212, 160, 23, 0.2);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 16px;
      text-align: center;
    }
    .info-box .code {
      color: #d4a017;
      font-size: 28px;
      letter-spacing: 4px;
      font-weight: 900;
    }
    .info-box .status {
      color: rgba(255, 255, 255, 0.4);
      font-size: 14px;
      margin-top: 5px;
    }
    .refresh-btn {
      background: rgba(184, 134, 11, 0.15);
      border: 1px solid rgba(184, 134, 11, 0.2);
      color: #d4a017;
      padding: 6px 18px;
      border-radius: 30px;
      font-family: "Cinzel", serif;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
      transition: 0.3s;
      margin-right: 10px;
    }
    .refresh-btn:hover {
      background: rgba(184, 134, 11, 0.25);
      box-shadow: 0 0 30px rgba(212, 160, 23, 0.05);
      transform: scale(1.05);
    }

    .day-night-toggle {
      width: 100%;
      padding: 14px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      transition: 0.3s;
      font-family: 'Cinzel', serif;
      margin-bottom: 14px;
      text-align: center;
    }
    .day-night-toggle.day {
      background: rgba(74, 58, 10, 0.4);
      color: #d4a017;
      border: 2px solid rgba(212, 160, 23, 0.2);
      box-shadow: 0 0 20px rgba(212, 160, 23, 0.05);
    }
    .day-night-toggle.day:hover {
      background: rgba(74, 58, 10, 0.6);
      box-shadow: 0 0 30px rgba(212, 160, 23, 0.1);
    }
    .day-night-toggle.night {
      background: rgba(26, 26, 74, 0.4);
      color: #4a4aff;
      border: 2px solid rgba(74, 74, 255, 0.2);
      box-shadow: 0 0 20px rgba(74, 74, 255, 0.05);
    }
    .day-night-toggle.night:hover {
      background: rgba(26, 26, 74, 0.6);
      box-shadow: 0 0 30px rgba(74, 74, 255, 0.1);
    }

    /* 🛠️ تعديل تنسيق زر الخروج ليكون تحت العرَض وفي الترتيب الطبيعي للبطاقة */
    #exitBtn {
      position: relative;
      width: 100%;
      margin-top: 20px;
      padding: 14px 20px;
      border-radius: 12px;
      background: rgba(161, 13, 13, 0.6);
      color: #ff6b6b;
      font-family: 'Cinzel', serif;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
      font-size: 16px;
      border: 1px solid rgba(255, 0, 0, 0.2);
      box-sizing: border-box;
      display: block;
    }
    #exitBtn:hover {
      background: rgba(139, 0, 0, 0.8);
      box-shadow: 0 0 25px rgba(139, 0, 0, 0.3);
      transform: scale(1.01);
    }

    .infected-badge {
      background: rgba(107, 26, 26, 0.3);
      color: #ff6b6b;
      padding: 1px 8px;
      border-radius: 12px;
      font-size: 10px;
      border: 1px solid #ff6b6b;
      margin-right: 5px;
      display: inline-block;
    }
    .wolf-badge {
      background: rgba(26, 58, 26, 0.3);
      color: #66bb6a;
      padding: 1px 8px;
      border-radius: 12px;
      font-size: 10px;
      border: 1px solid #66bb6a;
      margin-right: 5px;
      display: inline-block;
    }
    .convertible-badge {
      background: rgba(74, 58, 10, 0.3);
      color: #d4a017;
      padding: 1px 8px;
      border-radius: 12px;
      font-size: 10px;
      border: 1px solid #d4a017;
      margin-right: 5px;
      display: inline-block;
    }

    .pending-deaths {
      background: rgba(26, 10, 10, 0.5);
      border: 2px solid rgba(255, 26, 26, 0.15);
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 10px;
      display: none;
    }
    .pending-deaths .title {
      color: #ff6b6b;
      font-size: 14px;
      font-weight: bold;
      font-family: 'Cinzel', serif;
    }
    .pending-deaths .list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 6px;
    }
    .pending-deaths .list .dead-item {
      background: rgba(42, 10, 10, 0.5);
      border: 1px solid rgba(255, 26, 26, 0.15);
      border-radius: 6px;
      padding: 4px 12px;
      color: #ff6b6b;
      font-size: 13px;
      font-family: 'Cinzel', serif;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .pending-deaths .list .dead-item .remove-death {
      background: rgba(107, 26, 26, 0.4);
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 0 8px;
      font-size: 12px;
      cursor: pointer;
      font-family: 'Cinzel', serif;
      transition: 0.3s;
    }
    .pending-deaths .list .dead-item .remove-death:hover {
      background: rgba(139, 0, 0, 0.6);
    }

    #players {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding-bottom: 10px;
    }

    .player-card {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 8px;
      padding: 3px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: 0.3s;
      min-height: 38px;
      height: 38px;
      flex-wrap: wrap;
      gap: 4px;
    }
    .player-card:hover {
      border-color: rgba(255, 0, 0, 0.15);
      box-shadow: 0 0 8px rgba(255, 0, 0, 0.05);
    }
    .player-card.dead {
      opacity: 0.4;
      border-color: rgba(255, 255, 255, 0.02);
      background: rgba(255, 255, 255, 0.01);
    }
    .player-card .info {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1;
      min-width: 0;
      height: 100%;
    }
    .player-card .avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid rgba(255, 0, 0, 0.1);
      object-fit: cover;
      background: rgba(13, 8, 5, 0.6);
      flex-shrink: 0;
    }
    .player-card .details {
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .player-card .details .name {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.8);
      font-weight: 700;
    }
    .player-card .details .role {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.3);
    }
    .player-card .details .role strong {
      color: rgba(255, 255, 255, 0.5);
    }

    .player-card .actions {
      display: flex;
      gap: 4px;
      flex-shrink: 0;
      flex-wrap: wrap;
    }
    .player-card .actions button {
      padding: 2px 10px;
      border: none;
      border-radius: 4px;
      font-family: 'Cinzel', serif;
      font-weight: bold;
      font-size: 10px;
      cursor: pointer;
      transition: 0.3s;
      background: rgba(255, 255, 255, 0.02);
      color: rgba(255, 255, 255, 0.6);
      white-space: nowrap;
      height: 24px;
      line-height: 1;
      border: 1px solid rgba(255, 255, 255, 0.04);
    }
    .player-card .actions button:hover:not(:disabled) {
      transform: scale(1.05);
      background: rgba(255, 255, 255, 0.04);
    }
    .player-card .actions .kill {
      background: rgba(107, 26, 26, 0.3);
      color: #ff6b6b;
      border-color: rgba(255, 0, 0, 0.1);
    }
    .player-card .actions .kill:hover:not(:disabled) {
      background: rgba(139, 0, 0, 0.4);
      box-shadow: 0 0 12px rgba(139, 0, 0, 0.15);
    }
    .player-card .actions .infect {
      background: rgba(26, 74, 26, 0.3);
      color: #66bb6a;
      border-color: rgba(46, 204, 113, 0.1);
    }
    .player-card .actions .infect:hover:not(:disabled) {
      background: rgba(46, 204, 113, 0.2);
      box-shadow: 0 0 12px rgba(46, 204, 113, 0.1);
    }
    .player-card .actions .convert-to-wolf {
      background: rgba(74, 58, 10, 0.3);
      color: #d4a017;
      border-color: rgba(212, 160, 23, 0.1);
    }
    .player-card .actions .convert-to-wolf:hover:not(:disabled) {
      background: rgba(212, 160, 23, 0.15);
      box-shadow: 0 0 12px rgba(212, 160, 23, 0.1);
    }
    .player-card .actions .message-btn {
      background: rgba(184, 134, 11, 0.15);
      color: #d4a017;
      border-color: rgba(184, 134, 11, 0.1);
    }
    .player-card .actions .message-btn:hover:not(:disabled) {
      background: rgba(184, 134, 11, 0.25);
      box-shadow: 0 0 12px rgba(184, 134, 11, 0.1);
    }
    .player-card .actions button:disabled {
      opacity: 0.3;
      cursor: not-allowed;
      transform: none !important;
      display: none !important; /* إخفاء الزر تماماً فور إيقافه */
    }
    .player-card.dead .actions button {
      opacity: 0.2;
      pointer-events: none;
    }

    #messagesContainer {
      margin-top: 10px;
      background: rgba(13, 8, 5, 0.4);
      border: 1px solid rgba(212, 160, 23, 0.08);
      border-radius: 12px;
      padding: 12px;
      touch-action: none;
    }
    #messagesContainer .title {
      color: #d4a017;
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }
    #messagesContainer .title .badge {
      background: rgba(212, 160, 23, 0.1);
      color: #d4a017;
      padding: 2px 10px;
      border-radius: 20px;
      font-size: 12px;
    }
    #messagesContainer .title .clear-btn {
      background: rgba(107, 26, 26, 0.3);
      color: #ff6b6b;
      border: none;
      border-radius: 6px;
      padding: 4px 12px;
      font-family: 'Cinzel', serif;
      font-size: 12px;
      cursor: pointer;
      transition: 0.3s;
    }
    #messagesContainer .title .clear-btn:hover {
      background: rgba(139, 0, 0, 0.4);
      box-shadow: 0 0 15px rgba(139, 0, 0, 0.1);
    }

    .messages-wrapper {
      position: relative;
      display: flex;
      align-items: stretch;
      gap: 8px;
    }
    #messagesList {
      flex: 1;
      max-height: 200px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding-left: 4px;
      touch-action: pan-y;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      scroll-behavior: smooth;
      scrollbar-width: thin;
    }
    #messagesList::-webkit-scrollbar {
      width: 4px;
    }
    #messagesList::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.02);
      border-radius: 10px;
    }
    #messagesList::-webkit-scrollbar-thumb {
      background: rgba(212, 160, 23, 0.15);
      border-radius: 10px;
    }

    .scroll-btn {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(212, 160, 23, 0.08);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      min-width: 40px;
      color: rgba(212, 160, 23, 0.4);
      font-size: 20px;
      cursor: pointer;
      transition: 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Cinzel', serif;
      touch-action: manipulation;
      user-select: none;
      flex-shrink: 0;
    }
    .scroll-btn:hover {
      background: rgba(255, 255, 255, 0.04);
      color: rgba(212, 160, 23, 0.6);
      transform: scale(1.05);
    }
    .scroll-btn:active {
      transform: scale(0.95);
    }
    .scroll-btn.up {
      margin-bottom: auto;
    }
    .scroll-btn.down {
      margin-top: auto;
    }
    .scroll-buttons {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
    }

    .message-item {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 6px;
      padding: 6px 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      flex-shrink: 0;
    }
    .message-item .sender {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #d4a017;
      font-size: 12px;
      font-weight: bold;
      min-width: 70px;
    }
    .message-item .sender-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid rgba(212, 160, 23, 0.1);
      object-fit: cover;
      background: rgba(255, 255, 255, 0.02);
      flex-shrink: 0;
    }
    .message-item .sender .role-tag {
      color: rgba(255, 255, 255, 0.2);
      font-size: 10px;
      font-weight: normal;
      background: rgba(255, 255, 255, 0.02);
      padding: 0 6px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.02);
    }
    .message-item .sender .narrator-tag {
      color: #d4a017;
      font-size: 10px;
      font-weight: normal;
      background: rgba(42, 26, 10, 0.3);
      padding: 0 6px;
      border-radius: 10px;
      border: 1px solid rgba(212, 160, 23, 0.1);
    }
    .message-item .text {
      color: rgba(255, 255, 255, 0.5);
      font-size: 13px;
      flex: 1;
      min-width: 100px;
    }
    .message-item .time {
      color: rgba(255, 255, 255, 0.1);
      font-size: 10px;
      min-width: 50px;
      text-align: left;
      font-feature-settings: "tnum";
      direction: ltr;
    }
    .message-item .delete-msg {
      background: rgba(107, 26, 26, 0.3);
      color: #ff6b6b;
      border: none;
      border-radius: 4px;
      padding: 2px 8px;
      font-family: 'Cinzel', serif;
      font-size: 10px;
      cursor: pointer;
      transition: 0.3s;
    }
    .message-item .delete-msg:hover {
      background: rgba(139, 0, 0, 0.4);
      box-shadow: 0 0 10px rgba(139, 0, 0, 0.1);
    }
    .no-messages {
      color: rgba(255, 255, 255, 0.1);
      font-size: 13px;
      text-align: center;
      padding: 15px 10px;
      font-style: italic;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      background: rgba(17, 17, 17, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 16px;
      padding: 30px 25px;
      max-width: 400px;
      width: 90%;
      color: #fff;
    }
    .modal-content h3 {
      color: #d4a017;
      font-size: 20px;
      margin-bottom: 10px;
      text-align: center;
    }
    .modal-content p {
      color: rgba(255, 255, 255, 0.3);
      font-size: 13px;
      margin-bottom: 10px;
      text-align: center;
    }
    .modal-content textarea {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      background: rgba(255, 255, 255, 0.02);
      color: #fff;
      font-family: 'Cinzel', serif;
      font-size: 14px;
      resize: vertical;
      min-height: 80px;
      transition: 0.3s;
    }
    .modal-content textarea:focus {
      outline: none;
      border-color: rgba(212, 160, 23, 0.15);
      background: rgba(255, 255, 255, 0.04);
      box-shadow: 0 0 30px rgba(212, 160, 23, 0.02);
    }
    .modal-content textarea::placeholder {
      color: rgba(255, 255, 255, 0.1);
    }
    .modal-content .flex {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }
    .modal-content .flex .btn {
      flex: 1;
      padding: 10px;
      border-radius: 10px;
      border: none;
      font-family: 'Cinzel', serif;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      transition: 0.3s;
    }
    .modal-content .flex .btn-success {
      background: rgba(46, 204, 113, 0.08);
      color: #66bb6a;
      border: 1px solid rgba(46, 204, 113, 0.1);
    }
    .modal-content .flex .btn-success:hover {
      background: rgba(46, 204, 113, 0.12);
      box-shadow: 0 0 15px rgba(46, 204, 113, 0.05);
    }
    .modal-content .flex .btn-cancel {
      background: rgba(255, 255, 255, 0.02);
      color: rgba(255, 255, 255, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.04);
    }
    .modal-content .flex .btn-cancel:hover {
      background: rgba(255, 255, 255, 0.04);
      color: rgba(255, 255, 255, 0.5);
    }
    .modal-content .status-msg {
      color: rgba(255, 255, 255, 0.2);
      font-size: 13px;
      margin-top: 8px;
      text-align: center;
    }

    @media (max-width: 500px) {
      .player-card {
        height: auto;
        min-height: 44px;
        padding: 6px 8px;
        flex-wrap: wrap;
        gap: 4px;
      }
      .player-card .info {
        flex: 1 1 100%;
      }
      .player-card .actions {
        flex: 1 1 100%;
        justify-content: flex-start;
        gap: 8px;
      }
      .player-card .actions button {
        flex: 1;
        text-align: center;
        font-size: 12px;
        height: 30px;
        padding: 4px 10px;
      }
      .player-card .avatar {
        width: 24px;
        height: 24px;
      }
      .player-card .details .name {
        font-size: 13px;
      }
      .player-card .details .role {
        font-size: 10px;
      }
      #messagesList {
        max-height: 150px;
      }
      .message-item {
        flex-wrap: wrap;
        gap: 4px;
      }
      .message-item .sender {
        min-width: 60px;
        font-size: 11px;
      }
      .message-item .sender-avatar {
        width: 24px;
        height: 24px;
      }
      .message-item .text {
        font-size: 12px;
        width: 100%;
        order: 3;
      }
      .message-item .time {
        font-size: 9px;
        min-width: 50px;
      }
      .scroll-btn {
        width: 36px;
        height: 36px;
        min-width: 36px;
        font-size: 16px;
      }
      .day-night-toggle {
        font-size: 15px;
        padding: 12px;
      }
      #exitBtn {
        font-size: 14px;
        padding: 12px 16px;
      }
    }
  </style>
</head>
<body>
  <!-- الجسيمات -->
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>

  <div class="main-container">
    <div class="app-card">

      <div class="app-header">
        <div class="app-icon">🐺</div>
        <div class="app-title">Loup Garou</div>
        <div class="app-subtitle">👑 تحكم الراوي</div>
      </div>

      <button class="day-night-toggle day" id="dayNightToggle">☀️ أنت في النهار</button>

      <div id="pendingDeathsContainer" class="pending-deaths">
        <div class="title">💀 وفيات معلقة (سيتم الإعلان عنها عند حلول النهار)</div>
        <div id="pendingDeathsList" class="list"></div>
      </div>

      <div class="info-box">
        <div id="roomLabel">🔑 الغرفة: <span class="code" id="roomCodeDisplay">---</span></div>
        <div class="status" id="statusDisplay">⏳ جاري التحميل...</div>
        <button class="refresh-btn" id="refreshBtn">🔄 تحديث</button>
      </div>

      <div id="players"></div>

      <div id="messagesContainer">
        <div class="title">
          <span>📩 رسائل اللاعبين</span>
          <span class="badge" id="messagesCount">0</span>
          <button class="clear-btn" id="clearMessagesBtn">🗑️ مسح الكل</button>
        </div>
        <div class="messages-wrapper">
          <div id="messagesList">
            <div class="no-messages">📭 لا توجد رسائل من اللاعبين</div>
          </div>
          <div class="scroll-buttons">
            <button class="scroll-btn up" id="scrollUpBtn" title="تمرير للأعلى">▲</button>
            <button class="scroll-btn down" id="scrollDownBtn" title="تمرير للأسفل">▼</button>
          </div>
        </div>
      </div>

      <button id="exitBtn">⚰️ إنهاء الجولة والخروج</button>

    </div>
  </div>

  <div class="modal" id="messageModal">
    <div class="modal-content">
      <h3 id="modalTitle">📩 إرسال رسالة</h3>
      <p id="modalSubtitle">إلى: <span id="targetPlayerName">---</span></p>
      <textarea id="messageInput" placeholder="اكتب رسالتك هنا..."></textarea>
      <div class="flex">
        <button class="btn btn-success" id="sendMessageBtn">📤 إرسال</button>
        <button class="btn btn-cancel" id="closeMessageModal">إلغاء</button>
      </div>
      <p class="status-msg" id="modalStatus"></p>
      <input type="hidden" id="targetPlayerId" value="" />
    </div>
  </div>

  <script type="module">
    // ===== استيراد الدوال =====
    import {
      getRoomCode,
      clearRoomCode,
      checkRoomExpiry,
      listenToPlayers,
      getPlayers,
      killPlayer,
      infectPlayer,
      deleteRoom,
      db,
      ref,
      remove,
      onValue,
      push,
      update,
      get,
      getPlayer,
      clearWolfMessages,
      convertToWolf,
      isPlayerWolf
    } from "./logic.js";

    // ===== أداة لمساعدة تنسيق أسماء الأدوار بوضوح =====
    function getRoleText(roleVal) {
      if (!roleVal) return 'غير معروف';
      if (typeof roleVal === 'object') {
        return roleVal.ar || roleVal.fr || roleVal.en || 'غير معروف';
      }
      return roleVal;
    }

    // ===== عناصر الصفحة =====
    const roomCode = getRoomCode();
    console.log('🔑 roomCode من localStorage:', roomCode);

    const playerContainer = document.getElementById("players");
    const roomDisplay = document.getElementById("roomCodeDisplay");
    const statusDisplay = document.getElementById("statusDisplay");
    const refreshBtn = document.getElementById("refreshBtn");
    const messagesList = document.getElementById("messagesList");
    const messagesCount = document.getElementById("messagesCount");
    const clearMessagesBtn = document.getElementById("clearMessagesBtn");
    const scrollUpBtn = document.getElementById("scrollUpBtn");
    const scrollDownBtn = document.getElementById("scrollDownBtn");
    const dayNightToggle = document.getElementById("dayNightToggle");
    const pendingDeathsContainer = document.getElementById('pendingDeathsContainer');
    const pendingDeathsList = document.getElementById('pendingDeathsList');
    const messageModal = document.getElementById("messageModal");
    const targetPlayerName = document.getElementById("targetPlayerName");
    const targetPlayerId = document.getElementById("targetPlayerId");
    const messageInput = document.getElementById("messageInput");
    const sendMessageBtn = document.getElementById("sendMessageBtn");
    const closeMessageModal = document.getElementById("closeMessageModal");
    const modalStatus = document.getElementById("modalStatus");

    let pendingDeaths = [];
    let playersData = {};
    let rolesData = {};
    let isNight = false;

    if (!roomCode) {
      roomDisplay.textContent = "⚠️ غير معروف";
      statusDisplay.textContent = "❌ لا يوجد رمز غرفة";
      playerContainer.innerHTML =
        `<p style="color:#e74c3c; text-align:center;">❌ لا يوجد رمز غرفة. سيتم تحويلك إلى صفحة الراوي...</p>`;
      setTimeout(() => (window.location.href = "host.html"), 2000);
      throw new Error("No roomCode");
    }

    roomDisplay.textContent = roomCode;
    statusDisplay.textContent = "⏳ جاري التحميل...";

    // ===== التحقق من صلاحية الغرفة =====
    const valid = await checkRoomExpiry(roomCode);
    if (!valid) {
      alert("⏰ انتهت صلاحية الغرفة، سيتم تحويلك إلى الصفحة الرئيسية.");
      window.location.href = "index.html";
      throw new Error("Expired");
    }

    // ===== دوال الوفيات المعلقة =====
    function updatePendingDeathsUI() {
      if (pendingDeaths.length === 0) {
        pendingDeathsContainer.style.display = 'none';
        return;
      }
      pendingDeathsContainer.style.display = 'block';
      pendingDeathsList.innerHTML = '';
      pendingDeaths.forEach((death, index) => {
        const item = document.createElement('div');
        item.className = 'dead-item';
        item.innerHTML = `
          💀 ${death.name}
          <button class="remove-death" data-index="${index}">✕</button>
        `;
        const removeBtn = item.querySelector('.remove-death');
        removeBtn.addEventListener('click', () => {
          pendingDeaths.splice(index, 1);
          updatePendingDeathsUI();
        });
        pendingDeathsList.appendChild(item);
      });
    }

    async function sendAllPendingDeaths() {
      if (pendingDeaths.length === 0) return;
      
      const deathsRef = ref(db, `rooms/${roomCode}/deathNotifications`);
      for (const death of pendingDeaths) {
        await push(deathsRef, {
          playerId: death.id,
          playerName: death.name,
          role: death.role,
          roleImage: death.roleImage,
          timestamp: Date.now()
        });
      }
      
      pendingDeaths = [];
      updatePendingDeathsUI();
    }

    // ===== دوال القتل والاستذئاب والتحويل =====
    window.killPlayer = async (id) => {
      const player = await getPlayer(roomCode, id);
      const playerName = player?.name || 'لاعب مجهول';
      
      if (!confirm(`⚠️ هل أنت متأكد من قتل "${playerName}"؟\nهذا الإجراء لا يمكن التراجع عنه!`)) {
        return;
      }
      
      try {
        await killPlayer(roomCode, id);
        
        pendingDeaths.push({
          id: id,
          name: playerName,
          role: getRoleText(player?.role),
          roleImage: player?.roleImage || ''
        });
        updatePendingDeathsUI();
        
        alert(`✅ تم قتل ${playerName} (سيتم الإعلان عنه عند حلول النهار)`);
      } catch (err) {
        alert('❌ خطأ: ' + err.message);
      }
    };

    window.infectPlayer = async (id) => {
      const player = await getPlayer(roomCode, id);
      const playerName = player?.name || 'لاعب مجهول';
      
      if (!confirm(`⚠️ هل أنت متأكد من استذئاب "${playerName}"؟\nهذا الإجراء لا يمكن التراجع عنه!`)) {
        return;
      }
      
      try {
        await infectPlayer(roomCode, id);
        alert(`✅ تم استذئاب ${playerName} بنجاح!`);
      } catch (err) {
        alert('❌ خطأ: ' + err.message);
      }
    };

    window.convertToWolfHandler = async (id, playerName) => {
      if (!confirm(`⚠️ هل أنت متأكد من تحويل "${playerName || 'اللاعب'}" إلى ذئب؟\nهذا الدور قابل للتحويل (مثل فتى البريه).`)) {
        return;
      }
      
      try {
        await convertToWolf(roomCode, id);
        alert(`✅ تم تحويل ${playerName || 'اللاعب'} إلى ذئب وأضيف إلى دردشة الذئاب!`);
      } catch (err) {
        alert('❌ حدث خطأ: ' + err.message);
      }
    };

    window.sendMessageToPlayer = (playerId, playerName) => {
      targetPlayerId.value = playerId;
      targetPlayerName.textContent = playerName || 'لاعب مجهول';
      document.getElementById('modalSubtitle').textContent = 'إلى: ' + (playerName || 'لاعب مجهول');
      messageInput.value = '';
      modalStatus.textContent = '';
      messageModal.style.display = 'flex';
    };

    // ===== دوال تحميل الأدوار =====
    async function loadRolesData() {
      const snap = await get(ref(db, 'global_roles'));
      rolesData = snap.val() || {};
    }
    await loadRolesData();

    function isRoleConvertible(role) {
      if (!role) return false;
      for (const key in rolesData) {
        const r = rolesData[key];
        const roleName = typeof r.name === 'object' ? r.name.ar : r.name;
        const playerRoleName = typeof role === 'object' ? role.ar : role;
        if (roleName === playerRoleName || roleName === role) {
          return r.isConvertible === true;
        }
      }
      return false;
    }

    // ===== دوال عرض الرسائل =====
    function formatTime(timestamp) {
      if (!timestamp) return '--:--';
      const date = new Date(timestamp);
      const hours = String(date.getHours()).padStart(2, '0');
      const minutes = String(date.getMinutes()).padStart(2, '0');
      return hours + ':' + minutes;
    }

    function renderMessages(messagesData) {
      messagesList.innerHTML = '';
      if (!messagesData || Object.keys(messagesData).length === 0) {
        messagesList.innerHTML = `<div class="no-messages">📭 لا توجد رسائل من اللاعبين</div>`;
        messagesCount.textContent = '0';
        return;
      }

      const filteredEntries = Object.entries(messagesData)
        .filter(([key, msg]) => !msg.fromNarrator)
        .sort((a, b) => (b[1].timestamp || 0) - (a[1].timestamp || 0));

      messagesCount.textContent = filteredEntries.length;

      if (filteredEntries.length === 0) {
        messagesList.innerHTML = `<div class="no-messages">📭 لا توجد رسائل من اللاعبين</div>`;
        return;
      }

      filteredEntries.forEach(([key, msg]) => {
        const div = document.createElement('div');
        div.className = 'message-item';

        const player = playersData[msg.playerId] || {};
        const playerName = player.name || msg.playerName || 'لاعب مجهول';
        const roleDisplay = getRoleText(player.role);
        const roleImage = player.roleImage || 'https://i.postimg.cc/wBjJYYVX/Carte-Simple-Villaegois.png';
        
        const senderHTML = `
          <span class="sender">
            <img src="${roleImage}" class="sender-avatar" onerror="this.src='https://i.postimg.cc/wBjJYYVX/Carte-Simple-Villaegois.png'" />
            ${playerName}
            <span class="role-tag">🎭 ${roleDisplay}</span>
          </span>
        `;

        const time = formatTime(msg.timestamp);
        const isWolfVote = msg.isWolfVote === true;
        const textStyle = isWolfVote ? 'color:#ff6b6b;' : '';

        let displayMessage = msg.message;
        if (isWolfVote && displayMessage.includes('الذئاب تريد قتل:')) {
          displayMessage = displayMessage.replace('الذئاب تريد قتل:', '🐺 قرار الذئاب:');
        }

        div.innerHTML = `
          ${senderHTML}
          <span class="text" style="${textStyle}">💬 ${displayMessage}</span>
          <span class="time">🕒 ${time}</span>
          <button class="delete-msg" data-key="${key}">✕</button>
        `;

        if (isWolfVote) {
          div.style.borderColor = 'rgba(255, 26, 26, 0.2)';
          div.style.borderWidth = '2px';
        }

        const deleteBtn = div.querySelector('.delete-msg');
        deleteBtn.addEventListener('click', async (e) => {
          e.stopPropagation();
          if (confirm('حذف هذه الرسالة؟')) {
            await remove(ref(db, `rooms/${roomCode}/messages/${key}`));
          }
        });

        messagesList.appendChild(div);
      });
    }

    function listenToMessages(roomCode) {
      const messagesRef = ref(db, `rooms/${roomCode}/messages`);
      onValue(messagesRef, (snapshot) => {
        const data = snapshot.val();
        renderMessages(data);
      });
    }

    // ===== دوال عرض اللاعبين =====
    function renderPlayers(data) {
      console.log('👥 عرض اللاعبين:', data);
      playerContainer.innerHTML = "";
      if (!data || Object.keys(data).length === 0) {
        playerContainer.innerHTML = `<p style="color:rgba(255,255,255,0.15); text-align:center;">📭 لا يوجد لاعبون في الغرفة</p>`;
        statusDisplay.textContent = "⏳ في انتظار اللاعبين...";
        playersData = {};
        return;
      }

      playersData = data;

      const entries = Object.entries(data);
      statusDisplay.textContent = `✅ ${entries.length} لاعب في الغرفة`;

      // 🛑 الفحص الصارم: هل يوجد أي لاعب مستذئب في هذه الغرفة؟
      const hasAnyInfectedInRoom = entries.some(([id, p]) => p.isInfected === true);

      entries.forEach(([id, player]) => {
        const card = document.createElement("div");
        card.className = "player-card";
        if (player.isDead) card.classList.add("dead");

        const avatarUrl = player.roleImage || "https://i.postimg.cc/wBjJYYVX/Carte-Simple-Villaegois.png";
        
        let badge = '';
        if (player.isInfected && !player.isDead) {
          badge = `<span class="infected-badge">🐺 مستذئب</span>`;
        } else if (player.isWolf && !player.isDead) {
          badge = `<span class="wolf-badge">🐺 ذئب</span>`;
        }
        
        const convertible = isRoleConvertible(player.role);
        if (convertible && !player.isDead && !player.isInfected && !player.isWolf) {
          badge += `<span class="convertible-badge">🔄 قابل للتحويل</span>`;
        }

        const roleDisplay = getRoleText(player.role);

        let actionsHTML = `
          <button class="kill" data-id="${id}">🗡️ قتل</button>
          <button class="infect" data-id="${id}">🐺 استذئاب</button>
        `;

        if (convertible && !player.isDead && !player.isInfected && !player.isWolf) {
          actionsHTML += `<button class="convert-to-wolf" data-id="${id}">🔄 تحويل إلى ذئب</button>`;
        }

        actionsHTML += `<button class="message-btn" data-id="${id}" data-name="${player.name}">📩</button>`;

        card.innerHTML = `
          <div class="info">
            <img src="${avatarUrl}" class="avatar" onerror="this.src='https://i.postimg.cc/wBjJYYVX/Carte-Simple-Villaegois.png'" />
            <div class="details">
              <span class="name">${player.name} ${badge}</span>
              <span class="role">الدور <strong>${roleDisplay}</strong></span>
            </div>
          </div>
          <div class="actions">
            ${actionsHTML}
          </div>
        `;

        const killBtn = card.querySelector('.kill');
        const infectBtn = card.querySelector('.infect');
        const convertBtn = card.querySelector('.convert-to-wolf');
        const messageBtn = card.querySelector('.message-btn');

        killBtn.addEventListener('click', () => {
          window.killPlayer(id);
        });

        infectBtn.addEventListener('click', () => {
          window.infectPlayer(id);
        });

        if (convertBtn) {
          convertBtn.addEventListener('click', () => {
            const player = playersData[id];
            window.convertToWolfHandler(id, player?.name);
          });
        }

        messageBtn.addEventListener('click', () => {
          window.sendMessageToPlayer(id, player.name);
        });

        // 🔒 إخفاء وتعطيل زر الاستذئاب لجميع اللاعبين فور قيام الراوي باستذئاب أي لاعب
        if (hasAnyInfectedInRoom || player.isDead || player.isInfected) {
          infectBtn.disabled = true;
        }

        if (player.isDead) {
          killBtn.disabled = true;
          infectBtn.disabled = true;
          if (convertBtn) convertBtn.disabled = true;
          messageBtn.disabled = true;
        }

        playerContainer.appendChild(card);
      });
    }

    // ===== دوال التحكم بالليل والنهار =====
    async function updateGameState(nightMode) {
      isNight = nightMode;
      await update(ref(db, `rooms/${roomCode}/gameState`), { isNight: nightMode });
      
      if (nightMode) {
        dayNightToggle.textContent = '🌙 أنت في الليل';
        dayNightToggle.className = 'day-night-toggle night';
      } else {
        dayNightToggle.textContent = '☀️ أنت في النهار';
        dayNightToggle.className = 'day-night-toggle day';
        await sendAllPendingDeaths();
        await clearWolfMessages(roomCode);
        alert('☀️ حل النهار! تم الإعلان عن الوفيات.');
      }
    }

    function listenToGameState(roomCode) {
      const stateRef = ref(db, `rooms/${roomCode}/gameState`);
      onValue(stateRef, (snapshot) => {
        const data = snapshot.val();
        if (data) {
          updateGameState(data.isNight === true);
        }
      });
    }

    // ===== أحداث الأزرار =====
    dayNightToggle.addEventListener('click', async () => {
      const newState = !isNight;
      await updateGameState(newState);
    });

    clearMessagesBtn.addEventListener('click', async () => {
      if (confirm('⚠️ هل أنت متأكد من مسح جميع الرسائل؟')) {
        await remove(ref(db, `rooms/${roomCode}/messages`));
      }
    });

    scrollUpBtn.addEventListener('click', () => {
      messagesList.scrollBy({ top: -80, behavior: 'smooth' });
    });
    scrollDownBtn.addEventListener('click', () => {
      messagesList.scrollBy({ top: 80, behavior: 'smooth' });
    });

    // زر التحديث اليدوي (احتياطي فقط)
    refreshBtn.addEventListener("click", async () => {
      const data = await getPlayers(roomCode);
      renderPlayers(data);
    });

    closeMessageModal.addEventListener('click', () => {
      messageModal.style.display = 'none';
    });

    window.addEventListener('click', (e) => {
      if (e.target === messageModal) messageModal.style.display = 'none';
    });

    sendMessageBtn.addEventListener('click', async () => {
      const playerId = targetPlayerId.value;
      const message = messageInput.value.trim();
      if (!message) {
        modalStatus.textContent = '⚠️ الرجاء كتابة رسالة!';
        modalStatus.style.color = '#e74c3c';
        return;
      }
      if (!playerId) {
        modalStatus.textContent = '❌ لم يتم تحديد لاعب!';
        modalStatus.style.color = '#e74c3c';
        return;
      }

      try {
        const player = await getPlayer(roomCode, playerId);
        const playerName = player?.name || 'لاعب مجهول';
        const messagesRef = ref(db, `rooms/${roomCode}/messages`);
        await push(messagesRef, {
          playerId: playerId,
          playerName: playerName,
          message: message,
          timestamp: Date.now(),
          fromNarrator: true
        });
        modalStatus.textContent = '✅ تم إرسال الرسالة!';
        modalStatus.style.color = '#2ecc71';
        messageInput.value = '';
        setTimeout(() => {
          modalStatus.textContent = '';
          messageModal.style.display = 'none';
        }, 1500);
      } catch (err) {
        modalStatus.textContent = '❌ خطأ: ' + err.message;
        modalStatus.style.color = '#e74c3c';
      }
    });

    document.getElementById("exitBtn").addEventListener("click", async () => {
      if (!confirm('⚠️ هل أنت متأكد من إنهاء الجولة والخروج؟ سيتم حذف الغرفة بالكامل.')) return;
      try {
        await deleteRoom(roomCode);
      } catch (err) {
        console.error(err);
        alert("⚠️ حدث خطأ أثناء حذف الغرفة");
      }
      clearRoomCode();
      window.location.href = "index.html";
    });

    // ===== بدء الاستماع اللحظي الفوري بدون وميض =====
    listenToPlayers(roomCode, (data) => {
      renderPlayers(data);
    });

    listenToMessages(roomCode);
    listenToGameState(roomCode);

    // تم حذف دورة الـ setInterval بالكامل من هنا لضمان سلاسة التطبيق واستقراره.

    console.log('🚀 تم تحميل صفحة تحكم الراوي (host-control.html) بنجاح للغرفة:', roomCode);
  </script>
</body>
</html>
